<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clothes Shop</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <div class="container">
                <div class="header__body">
                    <div class="header__logo">
                        <a href="index.html">KOKO</a>
                    </div>
                    <div class="header__search">
                        <form action="" class="form">
                            <input type="text" placeholder="Search" spellcheck="false">
                        </form>
                    </div>
                </div>
            </div>
        </header>
        <main class="main">
            <div class="container">
                <div class="categories">
                    <div class="cat__title">
                        <h3>Sort by:</h3>
                    </div>
                    <div class="cat__block">
                        <a href="" class="button">Men's Clothing</a>
                        <div class="cat__block-close hidden">
                            <img src="cancel.svg" alt="close button icon">
                        </div>
                    </div>
                    <div class="cat__block">
                        <a href="" class="button">Jewelery</a>
                        <div class="cat__block-close hidden">
                            <img src="cancel.svg" alt="close button icon">
                        </div>
                    </div>
                    <div class="cat__block">
                        <a href="" class="button">Electronics</a>
                        <div class="cat__block-close hidden">
                            <img src="cancel.svg" alt="close button icon">
                        </div>
                    </div>
                    <div class="cat__block">
                        <a href="" class="button">Women's Clothing</a>
                        <div class="cat__block-close hidden">
                            <img src="cancel.svg" alt="close button icon">
                        </div>
                    </div>
                </div>
                <div class="main__body"></div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
